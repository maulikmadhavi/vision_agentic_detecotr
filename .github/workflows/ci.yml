name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Locked install of the default env only (no CUDA torch, no models, no network services).
      # `locked: true` fails if pixi.lock is out of date with pyproject.toml.
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.62.2
          environments: default
          locked: true
      - name: Import smoke check
        run: pixi run --locked python -c "import routing.cli, routing.pipeline, services_embedding.client, service_detector_vlm.openai_service_call, service_detector_gdino.client"
      - name: Default test suite
        run: pixi run --locked test
