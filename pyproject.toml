[project]
name = "vad"
version = "0.1.0"
description = "Adaptive image routing for custom object detection"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Slicing is native (src/routing/slicing.py); nothing imports the SAHI package, so
# there is no SAHI extra to pin. Add one with an exact pin if a SAHI bridge is written.
dev = ["pytest>=8", "fastapi>=0.115"]  # fastapi: Grounding DINO server fake-model tests (no torch)
# Official COCO bbox evaluator: `vad-route evaluate` reports it next to the custom one (user-approved, D-15). An extra,
# not a core dependency, so model-serving installs of vad (e.g. the Grounding DINO workspace) do not get it.
eval = ["pycocotools>=2.0.8"]

[project.scripts]
vad-route = "routing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routing", "src/services_embedding", "src/service_detector_vlm", "src/service_detector_gdino"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "vlm: requires a reachable OpenAI-compatible VLM endpoint (VAD_VLM_URL / VAD_VLM_MODEL; default local LM Studio)",
    "gdino: requires the local Grounding DINO server (src/service_detector_gdino)",
    "wemm: requires the WeMM embedding server at $VAD_WEMM_URL",
    "e2e: requires all three live services at once (Grounding DINO, WeMM, VLM endpoint)",
]
addopts = "-m 'not vlm and not gdino and not wemm and not e2e'"

# --------------------------------------------------------------------------- pixi
# Environment manager for this repo (no venv/uv/conda). `pixi run test`.

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.dependencies]
python = "3.13.*"

[tool.pixi.pypi-dependencies]
vad = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev", "eval"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest"
test-vlm = "pytest -m vlm -rs"
test-gdino = "pytest -m gdino -rs"
test-wemm = "pytest -m wemm -rs"
test-e2e = "pytest -m e2e -rs"
# Release check: every live test must run; an unreachable service FAILS instead of skipping.
test-live-required = { cmd = "pytest -m 'gdino or wemm or vlm or e2e' -rs", env = { VAD_LIVE_REQUIRED = "1" } }
export-schema = "vad-route export-schema --out schemas"
