[project]
name = "vad"
version = "0.1.0"
description = "Adaptive image routing for custom object detection"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Slicing is native (src/vad/routing/slicing.py); nothing imports the SAHI package, so
# there is no SAHI extra to pin. Add one with an exact pin if a SAHI bridge is written.
# Live Stage A relevance (embedder.OpenClipRelevance). Install torch from the CUDA index
# for GPU use, e.g. torch 2.11.0+cu128 as in the dev venv.
clip = ["open_clip_torch>=4.2,<5", "torch>=2.11,<3"]
dev = ["pytest>=8"]

[project.scripts]
vad-route = "vad.routing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lmstudio: requires a running LM Studio server with a vision model",
    "clip: requires open_clip + torch and local CLIP weights (VAD_CLIP_WEIGHTS or the HF cache)",
]
addopts = "-m 'not lmstudio and not clip'"
